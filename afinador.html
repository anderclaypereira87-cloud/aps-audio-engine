<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="author" content="Anderclay Pereira Silva"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131b"><title>Afinador e Metrônomo · APS</title><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon-192.png">
<style>*{box-sizing:border-box}body{margin:0;background:#0c0e18;color:#eee9df;font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif}main{max-width:540px;margin:0 auto;padding:14px 14px 60px}header{display:flex;align-items:center;gap:10px}header a{color:#e5be74;text-decoration:none;font-weight:800;border:1px solid #9e7c42;border-radius:10px;padding:6px 10px}h1{font-size:19px;margin:0;color:#e5be74}.tabs{display:flex;gap:6px;margin:14px 0}.tabs button{flex:1;padding:12px;border-radius:12px;border:1px solid #5d4c2c;background:#1b2130;color:#f5d79e;font-weight:800;font-size:15px}.tabs button.on{background:#dbb66f;color:#151922}.card{background:#181d2b;border:1px solid #444b58;border-radius:18px;padding:16px;margin:10px 0}.note{font-size:72px;font-weight:850;text-align:center;line-height:1;color:#fff}.note sub{font-size:24px;color:#aab}.hz{text-align:center;color:#aab;font-size:14px;min-height:20px}svg{display:block;width:100%;max-width:360px;margin:0 auto}.big{display:block;width:100%;padding:16px;border-radius:13px;border:0;background:#dbb66f;color:#151922;font-weight:850;font-size:17px;margin-top:10px}.big.stop{background:#5a2b2b;color:#fff}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}select,input[type=number]{background:#10131b;color:#eee;border:1px solid #555;border-radius:9px;padding:8px;font-size:15px}.strings{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}.strings span{border:1px solid #444b58;border-radius:9px;padding:5px 9px;font-weight:700;color:#ccd}.strings span.hit{background:#2b4a33;border-color:#6bd08a;color:#d9ffe3}.status{text-align:center;font-weight:800;min-height:22px}.bpm{font-size:64px;font-weight:850;text-align:center;color:#fff}.bpm small{font-size:18px;color:#aab}input[type=range]{width:100%;accent-color:#dbb66f}.beats{display:flex;justify-content:center;gap:10px;margin:14px 0}.beats i{width:26px;height:26px;border-radius:50%;background:#2a3142;border:2px solid #555}.beats i.acc{border-color:#dbb66f}.beats i.on{background:#dbb66f}.beats i.on.acc{background:#ffdf8f;box-shadow:0 0 14px #dbb66f}.mini{background:#282f3d;color:#f5d79e;border:1px solid #997d4b;border-radius:10px;padding:10px 12px;font-weight:800;font-size:15px}label{color:#c8cad0;font-size:14px}.foot{text-align:center;color:#889;font-size:12px;margin-top:20px}.modes{display:flex;gap:6px;justify-content:center;margin:6px 0}.modes button{padding:8px 12px;border-radius:10px;border:1px solid #5d4c2c;background:#1b2130;color:#f5d79e;font-weight:800;font-size:14px}.modes button.on{background:#dbb66f;color:#151922}#strobe{display:block;width:100%;max-width:360px;height:120px;margin:4px auto;border-radius:12px;background:#0f131d;border:1px solid #333a48}.transp{text-align:center;color:#f5d79e;font-size:14px;min-height:18px}</style></head><body><main>
<header><a href="./index.html">← APS</a><h1>Afinador · Metrônomo</h1></header>
<div class="tabs"><button id="tA" class="on" type="button">🎯 Afinador</button><button id="tM" type="button">🥁 Metrônomo</button></div>
<section id="pA"><div class="card">
<div class="modes" role="group" aria-label="Modo de visualização"><button type="button" id="mNeedle" class="on">🎯 Ponteiro</button><button type="button" id="mStrobe">〰 Estroboscópico</button></div><div class="note" id="nt">—</div><div class="transp" id="tr"></div><div class="hz" id="hz">Toque uma corda por vez</div>
<canvas id="strobe" hidden aria-label="Afinador estroboscópico: parado = afinado"></canvas><svg id="needle" viewBox="0 0 300 160" aria-hidden="true"><path d="M30 150 A120 120 0 0 1 270 150" fill="none" stroke="#2a3142" stroke-width="14"/><path d="M134 32 A120 120 0 0 1 166 32" fill="none" stroke="#3fae62" stroke-width="14"/><g id="tk"></g><line id="nd" x1="150" y1="150" x2="150" y2="40" stroke="#dbb66f" stroke-width="4" stroke-linecap="round" style="transition:transform .12s;transform-origin:150px 150px"/><circle cx="150" cy="150" r="8" fill="#dbb66f"/><text x="22" y="158" fill="#889" font-size="12">-50</text><text x="262" y="158" fill="#889" font-size="12">+50</text></svg>
<div class="status" id="ss"></div>
<div class="row"><label>Instrumento <select id="inst"><option value="crom">Cromático</option><option value="violao">Violão / guitarra</option><option value="baixo">Baixo 4 cordas</option><option value="baixo5">Baixo 5 cordas</option><option value="cavaco">Cavaquinho (DGBD)</option><option value="ukulele">Ukulele</option><option value="sopro_bb">Sopro em Sib (trompete, clarinete, sax tenor/soprano)</option><option value="sopro_eb">Sopro em Mib (sax alto/barítono)</option><option value="voz">Voz</option></select></label><label>Lá (A4) <input id="a4" type="number" min="415" max="466" value="440" style="width:76px"> Hz</label></div>
<div class="strings" id="strs"></div>
<button class="big" id="go" type="button">🎤 Ligar afinador</button>
<p class="hz" style="margin-top:8px">Usa o microfone do aparelho. Nada é gravado nem enviado. Detector MPM em tempo real fora da tela principal (AudioWorklet), suavizado pela confiança da leitura.</p></div></section>
<section id="pM" hidden><div class="card">
<div class="bpm"><span id="bv">100</span> <small>BPM</small></div>
<input id="br" type="range" min="30" max="260" value="100" aria-label="Andamento">
<div class="row" style="justify-content:center"><button class="mini" id="m5" type="button">−5</button><button class="mini" id="m1" type="button">−1</button><button class="mini" id="tap" type="button" style="min-width:110px">👆 Tap</button><button class="mini" id="p1" type="button">+1</button><button class="mini" id="p5" type="button">+5</button></div>
<div class="row" style="justify-content:center"><label>Compasso <select id="cmp"><option value="2/4">2/4</option><option value="3/4">3/4</option><option value="4/4" selected>4/4</option><option value="6/8">6/8</option></select></label><label><input type="checkbox" id="acc" checked> Acentuar o 1º tempo</label></div>
<div class="beats" id="bts"></div>
<button class="big" id="mgo" type="button">▶ Iniciar metrônomo</button></div></section>
<p class="foot">APS Audio Engine · <b>Criado por Anderclay Pereira Silva</b></p>
</main><script src="./aps-elastic-core.js?v=2"></script><script>
const $=id=>document.getElementById(id),N=['Dó','Dó#','Ré','Ré#','Mi','Fá','Fá#','Sol','Sol#','Lá','Lá#','Si'];
let AC=null;const ac=()=>AC||(AC=new (window.AudioContext||window.webkitAudioContext)());
$('tA').onclick=()=>{$('tA').classList.add('on');$('tM').classList.remove('on');$('pA').hidden=false;$('pM').hidden=true;};
$('tM').onclick=()=>{$('tM').classList.add('on');$('tA').classList.remove('on');$('pM').hidden=false;$('pA').hidden=true;};
if(location.hash==='#metronomo')$('tM').click();
// ticks
{let s='';for(let c=-50;c<=50;c+=10){const a=(c/50)*60*Math.PI/180;const x1=150+Math.sin(a)*112,y1=150-Math.cos(a)*112,x2=150+Math.sin(a)*(c%50?102:96),y2=150-Math.cos(a)*(c%50?102:96);s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#667" stroke-width="2"/>`;}$('tk').innerHTML=s;}
const PRE={crom:[],violao:[40,45,50,55,59,64],baixo:[28,33,38,43],baixo5:[23,28,33,38,43],cavaco:[62,67,71,74],ukulele:[67,60,64,69],sopro_bb:[],sopro_eb:[],voz:[]};
const nm=m=>N[m%12]+(Math.floor(m/12)-1);
function strs(){$('strs').innerHTML=PRE[$('inst').value].map(m=>`<span data-m="${m}">${nm(m)}</span>`).join('');}
$('inst').onchange=strs;strs();
const TRANSP={sopro_bb:{st:2,label:'Sib'},sopro_eb:{st:9,label:'Mib'}};
let tuner=null,stream=null,sm=null,lastF=[],strobeMode=false,strobePhase=[0,0,0],lastFrame=0,fallbackTimer=0,lastCents=0,haveNote=false;
function show(f,clarity){const A4=+$('a4').value||440;let m=69+12*Math.log2(f/A4);const inst=$('inst').value,pr=PRE[inst]||[];
 if(inst==='voz'&&(f<70||f>1400))return;
 let tgt=Math.round(m);if(pr.length)tgt=pr.reduce((b,x)=>Math.abs(x-m)<Math.abs(b-m)?x:b,pr[0]);
 const c=Math.max(-50,Math.min(50,(m-tgt)*100)),a=0.25+0.45*clarity;sm=sm==null||Math.abs(c-sm)>35?c:sm*(1-a)+c*a;lastCents=sm;haveNote=true;
 const t=TRANSP[inst];if(t){const w=tgt+t.st;$('nt').innerHTML=N[w%12]+'<sub>'+(Math.floor(w/12)-1)+'</sub>';$('tr').textContent='Nota escrita para instrumento em '+t.label+' · som real '+nm(tgt);}
 else{$('nt').innerHTML=N[tgt%12]+'<sub>'+(Math.floor(tgt/12)-1)+'</sub>';$('tr').textContent=inst==='voz'?'Voz · '+nm(tgt):'';}
 $('hz').textContent=f.toFixed(2)+' Hz · '+(sm>0?'+':'')+sm.toFixed(0)+' cents';
 $('nd').style.transform=`rotate(${sm*1.2}deg)`;const ok=Math.abs(sm)<5;$('ss').textContent=ok?'✓ Afinado':(sm<0?'↑ Aperte (está baixo)':'↓ Afrouxe (está alto)');$('ss').style.color=ok?'#6bd08a':'#e5be74';$('nd').setAttribute('stroke',ok?'#6bd08a':'#dbb66f');
 document.querySelectorAll('#strs span').forEach(s=>s.classList.toggle('hit',+s.dataset.m===tgt&&ok));}
function onPitch(r){if(!r||!r.freq||r.clarity<0.8){return;}
 // mediana de 3 leituras: evita saltos de oitava isolados
 lastF.push(r.freq);if(lastF.length>3)lastF.shift();const srt=lastF.slice().sort((a,b)=>a-b),med=srt[srt.length>>1];
 if(Math.abs(12*Math.log2(r.freq/med))>0.7&&lastF.length===3)return;show(r.freq,r.clarity);}
function drawStrobe(ts){if(!strobeMode||!stream)return;const cv=$('strobe'),W=cv.clientWidth||320,H=120,d=Math.min(2,devicePixelRatio||1);if(cv.width!==Math.round(W*d)){cv.width=Math.round(W*d);cv.height=H*d;}
 const g=cv.getContext('2d');g.setTransform(d,0,0,d,0,0);const dt=lastFrame?Math.min(0.1,(ts-lastFrame)/1000):0;lastFrame=ts;g.fillStyle='#0f131d';g.fillRect(0,0,W,H);
 const v=haveNote?lastCents:0,ok=haveNote&&Math.abs(v)<2;[24,48,96].forEach((p,k)=>{strobePhase[k]=(strobePhase[k]+v*dt*(k+1)*3)%p;const y=8+k*38;g.fillStyle=ok?'#6bd08a':'#dbb66f';for(let x=-p+strobePhase[k];x<W+p;x+=p)g.fillRect(x,y,p/2,30);});
 g.fillStyle='#fff';g.font='12px system-ui';g.fillText(haveNote?(ok?'Parado = afinado':v<0?'Andando para a esquerda: baixo':'Andando para a direita: alto'):'Toque uma nota',8,H-4);requestAnimationFrame(drawStrobe);}
$('mNeedle').onclick=()=>{strobeMode=false;$('mNeedle').classList.add('on');$('mStrobe').classList.remove('on');$('strobe').hidden=true;$('needle').style.display='';};
$('mStrobe').onclick=()=>{strobeMode=true;$('mStrobe').classList.add('on');$('mNeedle').classList.remove('on');$('strobe').hidden=false;$('needle').style.display='none';lastFrame=0;requestAnimationFrame(drawStrobe);};
async function startTuner(){const c=ac();await c.resume();const src=c.createMediaStreamSource(stream);
 try{if(!c.audioWorklet)throw Error('sem AudioWorklet');await c.audioWorklet.addModule('./aps-elastic-core.js?v=2');await c.audioWorklet.addModule('./aps-tuner-worklet.js?v=1');
  const node=new AudioWorkletNode(c,'aps-mpm-tuner',{numberOfInputs:1,numberOfOutputs:1,outputChannelCount:[1]});node.port.onmessage=e=>onPitch(e.data);
  const mute=c.createGain();mute.gain.value=0;src.connect(node).connect(mute).connect(c.destination);tuner={node,src,mute,mode:'worklet'};}
 catch(e){ // reserva: mesma DSP na página, em lotes (navegadores antigos)
  const an=c.createAnalyser();an.fftSize=2048;src.connect(an);const dsp=APSElasticCore.createTunerDSP(c.sampleRate),buf=new Float32Array(an.fftSize);
  fallbackTimer=setInterval(()=>{an.getFloatTimeDomainData(buf);onPitch(dsp.push(buf));},Math.round(2048/c.sampleRate*1000));tuner={an,src,mode:'fallback'};}
 window.__apsTunerMode=tuner.mode;}
function stopTuner(){if(tuner){try{tuner.node&&tuner.node.port.postMessage('stop');tuner.src.disconnect();tuner.node&&tuner.node.disconnect();}catch(e){}}clearInterval(fallbackTimer);tuner=null;}
$('go').onclick=async()=>{if(stream){stopTuner();stream.getTracks().forEach(t=>t.stop());stream=null;haveNote=false;$('go').textContent='🎤 Ligar afinador';$('go').classList.remove('stop');return;}
 try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});await startTuner();$('go').textContent='⏹ Desligar afinador';$('go').classList.add('stop');if(strobeMode)requestAnimationFrame(drawStrobe);}
 catch(e){$('hz').textContent='Não foi possível usar o microfone: permita o acesso no navegador.';if(stream){stream.getTracks().forEach(t=>t.stop());}stream=null;}};
// metrônomo
let bpm=100,run=false,next=0,beat=0,tm=0,taps=[];
function setB(v){bpm=Math.max(30,Math.min(260,Math.round(v)));$('bv').textContent=bpm;$('br').value=bpm;}
$('br').oninput=e=>setB(+e.target.value);[['m5',-5],['m1',-1],['p1',1],['p5',5]].forEach(([i,d])=>$(i).onclick=()=>setB(bpm+d));
$('tap').onclick=()=>{const t=performance.now();taps=taps.filter(x=>t-x<2500);taps.push(t);if(taps.length>1){const iv=(taps[taps.length-1]-taps[0])/(taps.length-1);setB(60000/iv);}};
const meter=()=>{const [n,d]=$('cmp').value.split('/').map(Number);return {n,d};};
function dots(){const {n}=meter();$('bts').innerHTML=Array.from({length:n},(_,i)=>`<i class="${i===0&&$('acc').checked?'acc':''}"></i>`).join('');}
$('cmp').onchange=()=>{beat=0;dots();};$('acc').onchange=dots;dots();
function click(t,strong){const c=ac(),o=c.createOscillator(),g=c.createGain();o.frequency.value=strong?1600:1000;g.gain.setValueAtTime(strong?.9:.55,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.06);}
function sched(){const c=ac(),{n,d}=meter(),spb=60/bpm*(d===8?0.5:1);while(next<c.currentTime+.12){const b=beat%n,strong=$('acc').checked&&(b===0);click(next,strong);const when=(next-c.currentTime)*1000;setTimeout(()=>{document.querySelectorAll('#bts i').forEach((el,i)=>el.classList.toggle('on',i===b));},Math.max(0,when));next+=spb;beat++;}}
$('mgo').onclick=async()=>{if(run){run=false;clearInterval(tm);$('mgo').textContent='▶ Iniciar metrônomo';$('mgo').classList.remove('stop');return;}const c=ac();await c.resume();run=true;beat=0;next=c.currentTime+.05;tm=setInterval(sched,25);sched();$('mgo').textContent='⏹ Parar';$('mgo').classList.add('stop');};
</script></body></html>
