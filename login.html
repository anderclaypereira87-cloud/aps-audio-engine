<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c0e18">
<title>APS Audio Engine · Acesso</title>
<link rel="icon" href="./icon-192.png">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#32283a,#0b0e17 58%);color:#f3efe8;font:16px/1.5 system-ui,sans-serif}
main{width:min(450px,calc(100% - 28px));margin:22px auto;padding:26px 22px;background:#171d2b;border:1px solid #76603c;border-radius:22px;box-shadow:0 16px 60px #0008}
a{color:#ebca8d;text-decoration:none}.brand{margin:22px 0 4px;color:#ebca8d;font-size:22px;font-weight:900;letter-spacing:2px}
h1{margin:7px 0;font-size:27px}p,small{color:#bec5d0}label{display:block;margin:12px 0 5px;font-size:14px}
input{width:100%;border:1px solid #536073;border-radius:10px;background:#0e1320;color:white;padding:13px;font:inherit}
button{width:100%;margin:12px 0 0;padding:13px;min-height:48px;border-radius:11px;border:1px solid #8d734c;background:#dfbd79;color:#161b22;font:inherit;font-weight:800;cursor:pointer}
button.secondary{background:#283143;color:#f3ddae}button.text{width:auto;min-height:0;border:0;background:none;color:#eac98c;margin:8px 0 0;padding:3px;text-decoration:underline;font-size:14px}
button:disabled{opacity:.58;cursor:wait}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:10px}
#status{min-height:22px;margin:16px 0;color:#f6d492;overflow-wrap:anywhere}#signup-name{display:none}
hr{border:0;border-top:1px solid #394151;margin:22px 0}footer{color:#9ca4af;text-align:center;font-size:12px;margin-top:24px}
</style>
</head>
<body><main>
<a href="./index.html">← Voltar ao APS</a>
<div class="brand">APS AUDIO ENGINE</div>
<h1 id="title">Entrar na sua conta</h1>
<p>Seu espaço musical, com acesso por Google ou e-mail.</p>
<button class="secondary" id="google" type="button">Continuar com Google</button>
<hr><p style="text-align:center;margin:0">ou use seu e-mail</p>
<form id="form">
<div id="signup-name"><label for="name">Nome completo</label><input id="name" autocomplete="name" maxlength="140"></div>
<label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required>
<label for="password">Senha (mínimo 8 caracteres)</label><input id="password" type="password" minlength="8" autocomplete="current-password" required>
<button id="submit" type="submit">Entrar</button>
</form>
<div class="row"><button class="text" id="toggle" type="button">Criar conta gratuita</button><button class="text" id="forgot" type="button">Esqueci minha senha</button></div>
<p id="status" role="status" aria-live="polite"></p>
<small>O plano inicial é de teste gratuito. Dados de pagamento são tratados separadamente.</small>
<footer>APS Audio Engine · Criado por Anderclay Pereira Silva</footer>
</main>
<script src="./auth-config.js"></script>
<script src="./aps-pay.js"></script>
<script src="./aps-auth.js"></script>
<script>
(function(){
  const el = id => document.getElementById(id);
  let signingUp = false;
  const message = value => {el('status').textContent = value;};
  const next = APSAccount.next(new URLSearchParams(location.search).get('next'));
  const busy = state => {el('google').disabled=state;el('submit').disabled=state;el('forgot').disabled=state;};
  el('toggle').onclick = () => {
    signingUp = !signingUp;
    el('title').textContent = signingUp ? 'Criar conta no APS' : 'Entrar na sua conta';
    el('signup-name').style.display = signingUp ? 'block' : 'none';
    el('name').required = signingUp;
    el('password').autocomplete = signingUp ? 'new-password' : 'current-password';
    el('submit').textContent = signingUp ? 'Cadastrar grátis' : 'Entrar';
    el('toggle').textContent = signingUp ? 'Já tenho conta' : 'Criar conta gratuita';
    message('');
  };
  el('google').onclick = async () => {
    busy(true);message('Conectando ao Google...');
    try {
      sessionStorage.setItem('aps_auth_next', next);
      const sb = await APSAccount.client();
      const { error } = await sb.auth.signInWithOAuth({
        provider:'google',
        options:{redirectTo:APSAccount.url('./auth-callback.html')}
      });
      if(error) throw error;
    }catch(e){message('Não foi possível entrar com Google: '+e.message);}
    finally{busy(false);}
  };
  el('form').onsubmit = async e => {
    e.preventDefault();busy(true);message('');
    try {
      const sb = await APSAccount.client();
      const email = el('email').value.trim();
      const password = el('password').value;
      if(signingUp){
        const full_name = el('name').value.trim();
        if(!full_name) throw new Error('Informe seu nome.');
        const {data,error} = await sb.auth.signUp({
          email,password,
          options:{data:{full_name},emailRedirectTo:APSAccount.url('./auth-callback.html')}
        });
        if(error) throw error;
        if(data.session) location.assign(next);
        else message('Cadastro solicitado. Confira seu e-mail para confirmar a conta e entrar.');
      }else{
        const {data,error}=await sb.auth.signInWithPassword({email,password});
        if(error) throw error;
        if(!data.session) throw new Error('Sessão não iniciada.');
        location.assign(next);
      }
    }catch(e){message('Não foi possível continuar: '+e.message);}
    finally{busy(false);}
  };
  el('forgot').onclick = async () => {
    const email=el('email').value.trim();
    if(!email){message('Digite seu e-mail acima para recuperar a senha.');el('email').focus();return;}
    busy(true);
    try{
      const sb=await APSAccount.client();
      const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:APSAccount.url('./redefinir-senha.html')});
      if(error) throw error;
      message('Se o e-mail estiver cadastrado, você receberá um link para redefinir sua senha.');
    }catch(e){message('Falha na solicitação: '+e.message);}
    finally{busy(false);}
  };
  APSAccount.current().then(({user})=>{
    if(user) message('Você já está conectado como '+(user.email||'músico')+'. Abra a área do músico em conta.html.');
  }).catch(e=>message(e.message));
})();
</script></body></html>
