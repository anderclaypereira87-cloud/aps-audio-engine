<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APS · Admin</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0c0e18;color:#eee;font:15px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:20px}h1{color:#e5be74}.card{background:#171d2b;border:1px solid #444;border-radius:14px;padding:16px;margin:14px 0}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #333;text-align:left}input,select{padding:10px;border-radius:8px;border:1px solid #555;background:#0f131d;color:#eee}button{background:#dbb66f;color:#151922;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}button.alt{background:#282f3d;color:#f5d79e;border:1px solid #997d4b}.msg{color:#f5d79e;min-height:20px}</style></head>
<body><main>
<h1>Painel Admin APS</h1>
<p id="status" class="msg">Carregando…</p>
<div class="card" id="content" hidden>
 <h2>Usuários</h2>
 <table id="users"><thead><tr><th>E-mail</th><th>Nome</th><th>Plano</th><th>Ação</th></tr></thead><tbody></tbody></table>
</div>
<div class="card" id="grant" hidden>
 <h2>Liberar plano manualmente</h2>
 <input id="email" placeholder="E-mail do usuário" style="width:100%;margin-bottom:8px">
 <select id="plan"><option value="free">Grátis</option><option value="pro">Pro</option><option value="estudio">Estúdio</option></select>
 <button id="grantBtn">Liberar</button>
 <p id="grantMsg" class="msg"></p>
</div>
<p><a href="./painel.html" style="color:#e5be74">← Voltar ao estúdio</a></p>
</main>
<script src="./auth-config.js"></script>
<script src="./aps-pay.js"></script>
<script src="./aps-auth.js"></script>
<script>
(async()=>{
 const el=id=>document.getElementById(id), status=el('status');
 try{
  const {sb,user}=await APSAccount.current();
  if(!user){location.replace('./login.html?next=admin.html');return;}
  const profile=await APSAccount.profile(sb,user);
  if(profile.role!=='admin' && user.email!=='anderclay.pereira87@gmail.com'){
   status.textContent='Acesso restrito ao administrador.';return;
  }
  status.textContent='';
  el('content').hidden=false; el('grant').hidden=false;

  async function load(){
   const {data,error}=await sb.from('profiles').select('id,email,full_name,plan_tier,role').order('created_at',{ascending:false});
   if(error) throw error;
   const tb=el('users').querySelector('tbody'); tb.innerHTML='';
   (data||[]).forEach(p=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${p.email||''}</td><td>${p.full_name||''}</td><td>${p.plan_tier||'free'}</td><td><button class="alt" data-id="${p.id}" data-email="${p.email}">Mudar plano</button></td>`;
    tb.append(tr);
   });
   tb.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    el('email').value=b.dataset.email;
    el('email').scrollIntoView();
   });
  }
  await load();

  el('grantBtn').onclick=async()=>{
   const email=el('email').value.trim(), plan=el('plan').value;
   if(!email) return;
   el('grantMsg').textContent='Atualizando…';
   const {error}=await sb.from('profiles').update({plan_tier:plan}).eq('email',email);
   el('grantMsg').textContent=error?error.message:'Plano atualizado.';
   if(!error) load();
  };
 }catch(e){status.textContent=e.message;}
})();
</script></body></html>
